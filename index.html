<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranch Sorting Compteur</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ffb300;
            --text: #ffffff;
            --text-dim: #b0b0b0;
            --danger: #cf6679;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navigation Onglets */
        .tabs {
            display: flex;
            background-color: #000;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .tab-btn {
            flex: 1;
            padding: 15px 5px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
        }

        .tab-content {
            display: none;
            padding: 15px;
            flex: 1;
        }

        .tab-content.active {
            display: block;
        }

        /* Elements communs */
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        h2 {
            margin-top: 0;
            color: var(--accent);
        }

        button.btn-main {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button.btn-danger {
            background-color: var(--danger);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Pavé Numérique (Compteur) */
        .counter-display {
            font-size: 3rem;
            text-align: center;
            font-weight: bold;
            color: var(--accent);
            background: #000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .key {
            background-color: var(--card-bg);
            border: 1px solid #333;
            color: var(--text);
            font-size: 1.5rem;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .key:active {
            background-color: var(--accent);
            color: #000;
        }

        /* Formulaires & Listes */
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            background: #2b2b2b;
            color: var(--text);
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 1rem;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #2b2b2b;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Barre d'onglets -->
    <nav class="tabs">
        <button class="tab-btn active" onclick="showTab('compteur')">1. Compteur</button>
        <button class="tab-btn" onclick="showTab('vaches')">2. Vaches</button>
        <button class="tab-btn" onclick="showTab('resultats')">3. Résultats</button>
    </nav>

    <!-- Onglet 1: COMPTEUR -->
    <section id="compteur" class="tab-content active">
        <div class="card">
            <h2>Dernière Vache Triée</h2>
            <div id="display-vache" class="counter-display">-</div>
            
            <div class="keypad">
                <button class="key" onclick="pressKey(1)">1</button>
                <button class="key" onclick="pressKey(2)">2</button>
                <button class="key" onclick="pressKey(3)">3</button>
                <button class="key" onclick="pressKey(4)">4</button>
                <button class="key" onclick="pressKey(5)">5</button>
                <button class="key" onclick="pressKey(6)">6</button>
                <button class="key" onclick="pressKey(7)">7</button>
                <button class="key" onclick="pressKey(8)">8</button>
                <button class="key" onclick="pressKey(9)">9</button>
                <button class="key" onclick="pressKey(0)" style="grid-column: span 2;">0</button>
                <button class="key" onclick="resetCompteur()" style="background: var(--danger); color: white;">C</button>
            </div>
        </div>
    </section>

    <!-- Onglet 2: VACHES -->
    <section id="vaches" class="tab-content">
        <div class="card">
            <h2>Signaler une Vache Difficile</h2>
            <input type="number" id="vache-num" placeholder="N° de la vache (ex: 4)" min="0" max="9">
            <select id="vache-probleme">
                <option value="Lente / Refuse de passer">Lente / Refuse de passer</option>
                <option value="Colérique / Charge">Colérique / Charge</option>
                <option value="Sauteuse">Sauteuse</option>
                <option value="Agressive">Agressive</option>
                <option value="Autre">Autre</option>
            </select>
            <button class="btn-main" onclick="ajouterVache()">Enregistrer Vache</button>
        </div>

        <div class="card">
            <h2>Historique Vaches Remarquées</h2>
            <ul id="liste-vaches"></ul>
        </div>
    </section>

    <!-- Onglet 3: RÉSULTATS -->
    <section id="resultats" class="tab-content">
        <div class="card">
            <h2>Saisie Cavalier / Équipe</h2>
            <input type="text" id="res-equipe" placeholder="Nom de l'équipe ou du cavalier">
            <select id="res-classe">
                <option value="Open">Open</option>
                <option value="Amateur">Amateur</option>
                <option value="Club">Club</option>
                <option value="Youth">Youth</option>
            </select>
            <input type="number" id="res-vaches" placeholder="Nombre de vaches triées (0 à 10)">
            <input type="text" id="res-temps" placeholder="Temps (ex: 58.42s)">
            <button class="btn-main" onclick="ajouterResultat()">Enregistrer le passage</button>
        </div>

        <div class="card">
            <h2>Classement Provisoire</h2>
            <ul id="liste-resultats"></ul>
        </div>
    </section>

    <script>
        // --- DONNÉES & SAUVEGARDE AUTOMATIQUE ---
        let appData = {
            compteur: "-",
            vaches: [],
            resultats: []
        };

        // Charger les données sauvegardées au démarrage
        window.onload = function() {
            const savedData = localStorage.getItem('ranchSortingData');
            if (savedData) {
                appData = JSON.parse(savedData);
            }
            renderAll();
        };

        // Sauvegarder dans localStorage
        function saveData() {
            localStorage.setItem('ranchSortingData', JSON.stringify(appData));
            renderAll();
        }

        // --- GESTION DES ONGLETS ---
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // --- FONCTIONS ONGLET 1 (COMPTEUR) ---
        function pressKey(val) {
            appData.compteur = val;
            saveData();
        }

        function resetCompteur() {
            appData.compteur = "-";
            saveData();
        }

        // --- FONCTIONS ONGLET 2 (VACHES) ---
        function ajouterVache() {
            const num = document.getElementById('vache-num').value;
            const prob = document.getElementById('vache-probleme').value;

            if (num === "") return alert("Veuillez indiquer un numéro de vache.");

            appData.vaches.push({ num: num, prob: prob, id: Date.now() });
            document.getElementById('vache-num').value = "";
            saveData();
        }

        function supprimerVache(id) {
            appData.vaches = appData.vaches.filter(item => item.id !== id);
            saveData();
        }

        // --- FONCTIONS ONGLET 3 (RÉSULTATS) ---
        function ajouterResultat() {
            const equipe = document.getElementById('res-equipe').value;
            const classe = document.getElementById('res-classe').value;
            const vaches = document.getElementById('res-vaches').value;
            const temps = document.getElementById('res-temps').value;

            if (!equipe) return alert("Veuillez entrer un nom d'équipe ou de cavalier.");

            appData.resultats.push({
                equipe: equipe,
                classe: classe,
                vaches: vaches || 0,
                temps: temps || "-",
                id: Date.now()
            });

            document.getElementById('res-equipe').value = "";
            document.getElementById('res-vaches').value = "";
            document.getElementById('res-temps').value = "";
            saveData();
        }

        function supprimerResultat(id) {
            appData.resultats = appData.resultats.filter(item => item.id !== id);
            saveData();
        }

        // --- MISE À JOUR DE L'AFFICHAGE ---
        function renderAll() {
            // 1. Compteur
            document.getElementById('display-vache').innerText = appData.compteur;

            // 2. Vaches
            const listeVaches = document.getElementById('liste-vaches');
            listeVaches.innerHTML = "";
            appData.vaches.forEach(v => {
                listeVaches.innerHTML += `
                    <li>
                        <span><strong>Vache N°${v.num}</strong> : ${v.prob}</span>
                        <button class="btn-danger" onclick="supprimerVache(${v.id})">X</button>
                    </li>`;
            });

            // 3. Résultats
            const listeRes = document.getElementById('liste-resultats');
            listeRes.innerHTML = "";
            appData.resultats.forEach(r => {
                listeRes.innerHTML += `
                    <li>
                        <span><strong>${r.equipe}</strong> (${r.classe}) — <strong>${r.vaches} vaches</strong> en ${r.temps}</span>
                        <button class="btn-danger" onclick="supprimerResultat(${r.id})">X</button>
                    </li>`;
            });
        }
    </script>
</body>
</html>
