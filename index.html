<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranch Sorting Compteur</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ffb300;
            --text: #ffffff;
            --text-dim: #b0b0b0;
            --danger: #cf6679;
            --border: #333333;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Navigation Onglets */
        .tabs {
            display: flex;
            background-color: #000;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 5px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
        }

        .tab-content {
            display: none;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tab-content.active {
            display: block;
        }

        /* Cards */
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        h2 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.2rem;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background: #2b2b2b;
            color: var(--text);
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 1rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button.btn-main {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }

        button.btn-danger {
            background-color: var(--danger);
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Affichage Pavé */
        .display-box {
            background: #000;
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .current-cow {
            font-size: 3.8rem;
            font-weight: bold;
            color: var(--accent);
            line-height: 1;
        }

        .sequence-list {
            font-size: 1.1rem;
            color: var(--text);
            margin-top: 10px;
            min-height: 24px;
            word-break: break-all;
            letter-spacing: 2px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .key {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.8rem;
            padding: 18px 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .key:active {
            background-color: var(--accent);
            color: #000;
        }

        /* Listes */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li.item-row {
            background: #2b2b2b;
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent);
        }

        .badge-class {
            background: #333;
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Barre d'onglets -->
    <nav class="tabs">
        <button id="tab-btn-compteur" class="tab-btn active" onclick="switchTab('compteur')">1. COMPTEUR</button>
        <button id="tab-btn-vaches" class="tab-btn" onclick="switchTab('vaches')">2. VACHES</button>
        <button id="tab-btn-resultats" class="tab-btn" onclick="switchTab('resultats')">3. RÉSULTATS</button>
    </nav>

    <!-- ONGLET 1 : COMPTEUR -->
    <section id="tab-compteur" class="tab-content active">
        <div class="card">
            <h2>Compteur de Tri</h2>
            <div class="display-box">
                <div id="current-cow-display" class="current-cow">-</div>
                <div id="sequence-display" class="sequence-list">Séquence : aucune</div>
            </div>
            
            <div class="keypad">
                <button class="key" onclick="pressNumber(1)">1</button>
                <button class="key" onclick="pressNumber(2)">2</button>
                <button class="key" onclick="pressNumber(3)">3</button>
                <button class="key" onclick="pressNumber(4)">4</button>
                <button class="key" onclick="pressNumber(5)">5</button>
                <button class="key" onclick="pressNumber(6)">6</button>
                <button class="key" onclick="pressNumber(7)">7</button>
                <button class="key" onclick="pressNumber(8)">8</button>
                <button class="key" onclick="pressNumber(9)">9</button>
                <button class="key" style="background: #333;" onclick="removeLastNumber()" title="Annuler la dernière vache">⌫</button>
                <button class="key" onclick="pressNumber(0)">0</button>
                <button class="key" style="background: var(--danger); color: white;" onclick="clearCompteur()" title="Réinitialiser la manche">C</button>
            </div>
        </div>
    </section>

    <!-- ONGLET 2 : VACHES -->
    <section id="tab-vaches" class="tab-content">
        <div class="card">
            <h2>Signaler une Vache Difficile</h2>
            
            <label>N° de la vache ou Couleur du collier :</label>
            <input type="text" id="vache-id-input" placeholder="Ex: 4 / Collier Rouge">

            <label>Type de Problème :</label>
            <select id="vache-prob-input">
                <option value="Lente / Refuse de passer">Lente / Refuse de passer</option>
                <option value="Colérique / Charge">Colérique / Charge</option>
                <option value="Sauteuse">Sauteuse</option>
                <option value="Agressive">Agressive</option>
                <option value="Collante au troupeau">Collante au troupeau</option>
                <option value="Autre">Autre</option>
            </select>

            <button class="btn-main" onclick="ajouterVache()">Enregistrer Vache</button>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Historique Vaches Remarquées</h2>
                <button class="btn-danger" style="font-size: 0.8rem;" onclick="effacerToutesVaches()">Tout effacer</button>
            </div>
            <ul id="vaches-list"></ul>
        </div>
    </section>

    <!-- ONGLET 3 : RÉSULTATS -->
    <section id="tab-resultats" class="tab-content">
        <div class="card">
            <h2>Saisie Cavalier / Équipe</h2>
            
            <label>Nom du Cavalier / Équipe :</label>
            <input type="text" id="res-equipe" placeholder="Nom de l'équipe ou du cavalier">

            <label>Catégorie / Classe :</label>
            <select id="res-classe">
                <option value="Open">Open</option>
                <option value="Inter Open">Inter Open</option>
                <option value="Inter Limited">Inter Limited</option>
                <option value="Limited">Limited</option>
                <option value="Rookie">Rookie</option>
            </select>

            <h3 style="color: var(--accent); margin-top: 15px; font-size: 1rem;">Go 1 (Manche 1)</h3>
            <div class="grid-2">
                <div>
                    <label>Vaches triées :</label>
                    <input type="number" id="go1-vaches" placeholder="0 à 10" min="0" max="10">
                </div>
                <div>
                    <label>Temps (sec) :</label>
                    <input type="text" id="go1-temps" placeholder="Ex: 58.42s">
                </div>
            </div>

            <h3 style="color: var(--accent); margin-top: 15px; font-size: 1rem;">Go 2 (Manche 2)</h3>
            <div class="grid-2">
                <div>
                    <label>Vaches triées :</label>
                    <input type="number" id="go2-vaches" placeholder="0 à 10" min="0" max="10">
                </div>
                <div>
                    <label>Temps (sec) :</label>
                    <input type="text" id="go2-temps" placeholder="Ex: 60.00s">
                </div>
            </div>

            <button class="btn-main" onclick="ajouterResultat()">Enregistrer le passage</button>
        </div>

        <div class="card">
            <h2>Classement Provisoire</h2>
            <ul id="resultats-list"></ul>
        </div>
    </section>

    <script>
        // --- ÉTAT DU COMPTEUR ET DONNÉES ---
        let appState = {
            compteurSequence: [],
            vachesNotees: [],
            resultatsCavaliers: []
        };

        // Charger au démarrage
        window.onload = function() {
            const savedData = localStorage.getItem('ranchSortingApp_Data');
            if (savedData) {
                try {
                    appState = JSON.parse(savedData);
                } catch(e) {
                    console.error("Erreur au chargement des données", e);
                }
            }
            renderAll();
        };

        // Sauvegarder dans le navigateur
        function saveState() {
            localStorage.setItem('ranchSortingApp_Data', JSON.stringify(appState));
            renderAll();
        }

        // --- GESTION DES ONGLETS ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('tab-btn-' + tabName).classList.add('active');
        }

        // --- ONGLET 1 : PA VÉ COMPTEUR (AJOUT / ANNULATION / EFFACEMENT) ---
        function pressNumber(num) {
            appState.compteurSequence.push(num);
            saveState();
        }

        function removeLastNumber() {
            if (appState.compteurSequence.length > 0) {
                appState.compteurSequence.pop();
                saveState();
            }
        }

        function clearCompteur() {
            appState.compteurSequence = [];
            saveState();
        }

        // --- ONGLET 2 : VACHES ---
        function ajouterVache() {
            const idInput = document.getElementById('vache-id-input');
            const probInput = document.getElementById('vache-prob-input');

            if (!idInput.value.trim()) {
                alert("Veuillez indiquer un numéro de vache ou un collier.");
                return;
            }

            appState.vachesNotees.push({
                id: Date.now(),
                vache: idInput.value.trim(),
                probleme: probInput.value
            });

            idInput.value = "";
            saveState();
        }

        function supprimerVache(id) {
            appState.vachesNotees = appState.vachesNotees.filter(v => v.id !== id);
            saveState();
        }

        function effacerToutesVaches() {
            if (confirm("Effacer tout l'historique des vaches ?")) {
                appState.vachesNotees = [];
                saveState();
            }
        }

        // --- ONGLET 3 : RÉSULTATS ---
        function ajouterResultat() {
            const equipe = document.getElementById('res-equipe').value.trim();
            const classe = document.getElementById('res-classe').value;
            const go1Vaches = document.getElementById('go1-vaches').value || 0;
            const go1Temps = document.getElementById('go1-temps').value || "-";
            const go2Vaches = document.getElementById('go2-vaches').value || 0;
            const go2Temps = document.getElementById('go2-temps').value || "-";

            if (!equipe) {
                alert("Veuillez saisir un nom de cavalier ou d'équipe.");
                return;
            }

            appState.resultatsCavaliers.push({
                id: Date.now(),
                equipe: equipe,
                classe: classe,
                go1: { vaches: go1Vaches, temps: go1Temps },
                go2: { vaches: go2Vaches, temps: go2Temps }
            });

            document.getElementById('res-equipe').value = "";
            document.getElementById('go1-vaches').value = "";
            document.getElementById('go1-temps').value = "";
            document.getElementById('go2-vaches').value = "";
            document.getElementById('go2-temps').value = "";
            saveState();
        }

        function supprimerResultat(id) {
            appState.resultatsCavaliers = appState.resultatsCavaliers.filter(r => r.id !== id);
            saveState();
        }

        // --- RENDU DYNAMIQUE DE L'INTERFACE ---
        function renderAll() {
            // 1. Pavé Numérique & Séquence
            const seq = appState.compteurSequence;
            const currentDisplay = document.getElementById('current-cow-display');
            const seqDisplay = document.getElementById('sequence-display');

            if (seq.length > 0) {
                currentDisplay.innerText = seq[seq.length - 1];
                seqDisplay.innerText = "Séquence : " + seq.join(" - ");
            } else {
                currentDisplay.innerText = "-";
                seqDisplay.innerText = "Séquence : aucune";
            }

            // 2. Vaches Notées
            const vachesList = document.getElementById('vaches-list');
            vachesList.innerHTML = "";
            if (appState.vachesNotees.length === 0) {
                vachesList.innerHTML = `<li style="color:var(--text-dim); padding:10px;">Aucune vache notée.</li>`;
            } else {
                appState.vachesNotees.forEach(v => {
                    vachesList.innerHTML += `
                        <li class="item-row">
                            <div>
                                <strong>Vache N° ${v.vache}</strong><br>
                                <span style="color: var(--text-dim); font-size: 0.9rem;">${v.probleme}</span>
                            </div>
                            <button class="btn-danger" onclick="supprimerVache(${v.id})">X</button>
                        </li>`;
                });
            }

            // 3. Résultats Cavaliers
            const resList = document.getElementById('resultats-list');
            resList.innerHTML = "";
            if (appState.resultatsCavaliers.length === 0) {
                resList.innerHTML = `<li style="color:var(--text-dim); padding:10px;">Aucun résultat enregistré.</li>`;
            } else {
                appState.resultatsCavaliers.forEach(r => {
                    resList.innerHTML += `
                        <li class="item-row">
                            <div>
                                <div>
                                    <span class="badge-class">${r.classe}</span>
                                    <strong style="margin-left: 5px;">${r.equipe}</strong>
                                </div>
                                <div style="font-size: 0.85rem; color: var(--text-dim); margin-top: 4px;">
                                    Go 1: ${r.go1.vaches} v. (${r.go1.temps}) | Go 2: ${r.go2.vaches} v. (${r.go2.temps})
                                </div>
                            </div>
                            <button class="btn-danger" onclick="supprimerResultat(${r.id})">X</button>
                        </li>`;
                });
            }
        }
    </script>
</body>
</html>
